name: CI

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tool versions come from mise.toml, so CI and local development are
      # provably the same.
      - uses: jdx/mise-action@v4

      - run: terraform fmt -check -recursive

      # Modules have no backend and no credentials, so -backend=false is enough
      # to resolve providers and type-check every expression.
      - name: Validate modules
        run: |
          for dir in modules/*/; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

      - run: actionlint
